<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HuevosToons. · Radar de Huevos en Vivo</title>
  <meta name="description" content="Adquiere los mejores huevos con nosotros, podrás ver en vivo multiplicadores, mutaciones y unirte al instante.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HuevosToons.">
  <meta property="og:description" content="Radar de huevos y servidores en vivo para Roblox.">
  <meta property="og:image" content="assets/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a1226">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&family=Saira+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/site.css">
  <style>
    :root {
      --accent: #ffc21a;
      --bg: #0a1226;
      --surface: #111a33;
      --text: #f4f7ff;
      --muted: #a9b8d8;
      --font: "Luckiest Guy", "Segoe UI", sans-serif;
      --fb: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --fn: "Rajdhani", "Saira Semi Condensed", sans-serif;
      --r: 14px;
    }

    /* Additional polish styles */
    .row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1a2748;
      border-radius: var(--r);
      margin-bottom: 6px;
      overflow: hidden;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .row:hover {
      background: #20315c;
      transform: translateX(2px);
    }
    .row-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, rgba(255, 194, 26, 0.15), rgba(255, 194, 26, 0.03));
      border-right: 2px solid rgba(255, 194, 26, 0.4);
      pointer-events: none;
      z-index: 1;
      transition: width 0.3s ease;
    }
    .row > * {
      position: relative;
      z-index: 2;
    }
    .row .m {
      flex: none;
      min-width: 65px;
    }
    .row .m b {
      font-family: var(--fn);
      font-size: 19px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255, 194, 26, 0.5);
    }
    .row .chips {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .mut {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .mut-golden {
      background: linear-gradient(135deg, #ffd700, #ff9900);
      color: #1a0f00;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }
    .mut-silver {
      background: linear-gradient(135deg, #e6ecf8, #94a3b8);
      color: #0f172a;
    }
    .mut-rainbow {
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      background-size: 200% 200%;
      animation: rainbowShift 3s ease infinite;
      color: #000;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
    }
    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .mut-monstrous, .mut-big {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff;
    }
    .mut-robado {
      background: #ef4444;
      color: #fff;
    }
    .mut-parasite {
      background: #dc2626;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .chip-gen {
      padding: 3px 7px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 6px;
      font-family: var(--fn);
      font-weight: 600;
      font-size: 12px;
      color: #cbd5e1;
    }
    .chip-users, .chip-age {
      font-size: 11.5px;
      color: var(--muted);
    }
    .chip-speed {
      padding: 2px 7px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      font-family: var(--fn);
      font-weight: 700;
      font-size: 11px;
      color: #38bdf8;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .chip-money {
      padding: 2px 7px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 6px;
      font-family: var(--fn);
      font-weight: 700;
      font-size: 11px;
      color: #4ade80;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .bots {
      color: var(--muted);
      font: 600 12px/1 var(--fb);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      margin-right: 6px;
    }
    .bots::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: #6ee7b7;
      box-shadow: 0 0 8px #6ee7b7;
      vertical-align: 1px;
    }
    .row .act {
      flex: none;
    }
    .row .join {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 16px;
      border: none;
      border-radius: var(--r);
      background: linear-gradient(135deg, #ffb800, #ff7a1a);
      color: #1a0f00;
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 184, 0, 0.4);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .row .join:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }
    .row .join:active {
      transform: scale(0.97);
    }
    .row.is-robado {
      opacity: 0.65;
    }
    .gen-chip {
      display: inline-block;
      margin-left: 6px;
      font-size: 11px;
      padding: 2px 6px;
      background: rgba(255, 194, 26, 0.15);
      border: 1px solid rgba(255, 194, 26, 0.3);
      border-radius: 4px;
      color: var(--accent);
      vertical-align: middle;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
      padding: 16px;
      max-width: 1680px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 2px solid #2a4a8a;
      border-radius: var(--r);
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .card .zone {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .card .zone i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .card .tt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .card .tn {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card .pet {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: var(--r);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 3px;
      flex: none;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .card:hover .pet {
      transform: scale(1.08);
    }
    .card .nm {
      margin: 0;
      font-family: var(--font);
      font-size: 22px;
      line-height: 1.1;
      text-transform: uppercase;
    }
    .card .mt {
      display: flex;
      gap: 8px;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }
    .card .best {
      text-align: right;
    }
    .card .best small {
      display: block;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .card .best b {
      font-family: var(--fn);
      font-size: 26px;
      color: var(--accent);
      line-height: 1;
    }
    .card .rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* UFO event widget */
    .ufo-w {
      max-width: 1680px;
      margin: 8px auto 0;
      padding: 0 16px;
    }
    .ufo {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(17, 26, 51, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 71, 236, 0.3);
      border-radius: var(--r);
      padding: 8px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .ufo.live {
      border-color: #8cff4a;
      box-shadow: 0 0 20px rgba(140, 255, 74, 0.25);
    }
    .ufo-ic {
      width: 38px;
      height: 22px;
      flex: none;
    }
    .ufo-n {
      font-family: var(--font);
      font-size: 15px;
      color: #cb94ff;
    }
    .ufo.live .ufo-n {
      color: #8cff4a;
    }
    .ufo-s {
      font-size: 11px;
      color: #8cff4a;
      font-weight: 700;
      text-transform: uppercase;
    }
    .ufo-t {
      font-family: var(--fn);
      font-size: 18px;
      font-weight: 700;
      color: #f4f7ff;
      margin-left: auto;
    }
    .ufo-bell {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 6px;
    }
    .ufo-bell:hover {
      color: #fff;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .cards {
        grid-template-columns: 1fr;
      }
      .bar {
        flex-wrap: wrap;
      }
      .seg {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body class="theme-dark corners-soft">
  <div id="app">
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
