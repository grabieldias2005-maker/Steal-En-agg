<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HuevosToons. · Radar de Huevos en Vivo</title>
  <meta name="description" content="Adquiere los mejores huevos con nosotros, podrás ver en vivo multiplicadores, mutaciones y unirte al instante.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HuevosToons.">
  <meta property="og:description" content="Radar de huevos y servidores en vivo para Roblox.">
  <meta property="og:image" content="assets/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a1226">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&family=Saira+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/site.css">
  <style>
    :root {
      --accent: #ffc21a;
      --bg: #0a1226;
      --surface: #111a33;
      --text: #f4f7ff;
      --muted: #a9b8d8;
      --font: "Luckiest Guy", "Segoe UI", sans-serif;
      --fb: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --fn: "Rajdhani", "Saira Semi Condensed", sans-serif;
      --r: 14px;
    }

    /* Layout principal de tarjetas */
    .cards {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr)) !important;
      gap: 16px !important;
      padding: 16px !important;
      max-width: 1720px !important;
      margin: 0 auto !important;
    }
    .card {
      background: var(--surface) !important;
      border: 2px solid #20315c !important;
      border-radius: var(--r) !important;
      padding: 14px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
      position: relative !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: visible !important;
    }
    .card:hover {
      border-color: rgba(56, 189, 248, 0.4) !important;
    }

    /* Cabecera de tarjeta y mascota */
    .card .zone {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      margin-bottom: 8px !important;
      font-size: 11.5px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.08em !important;
      color: var(--muted) !important;
    }
    .card .zone i {
      width: 7px !important;
      height: 7px !important;
      border-radius: 50% !important;
    }
    .card .tt {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 10px !important;
      margin-bottom: 12px !important;
      padding-bottom: 10px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
    .card .tn {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      min-width: 0 !important;
    }
    .card .pet {
      width: 50px !important;
      height: 50px !important;
      object-fit: contain !important;
      border-radius: var(--r) !important;
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      padding: 3px !important;
      flex: 0 0 50px !important;
      display: block !important;
      transition: transform 0.2s ease, filter 0.2s ease !important;
    }
    .card:hover .pet {
      transform: scale(1.08) !important;
    }
    .card .nm {
      margin: 0 !important;
      font-family: var(--font) !important;
      font-size: 21px !important;
      line-height: 1.1 !important;
      text-transform: uppercase !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .card .mt {
      display: flex !important;
      gap: 8px !important;
      margin-top: 3px !important;
      font-size: 12px !important;
      color: var(--muted) !important;
    }
    .card .best {
      text-align: right !important;
      flex: 0 0 auto !important;
    }
    .card .best small {
      display: block !important;
      font-size: 10px !important;
      color: var(--muted) !important;
      text-transform: uppercase !important;
      letter-spacing: 0.1em !important;
    }
    .card .best b {
      font-family: var(--fn) !important;
      font-size: 26px !important;
      color: var(--accent) !important;
      line-height: 1 !important;
    }
    .card .rows {
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
    }

    /* Filas de servidor organizadas con Flexbox perfecto (sin superposiciones) */
    .row {
      position: relative !important;
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 10px !important;
      padding: 8px 12px !important;
      background: #1a2748 !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: var(--r) !important;
      margin-bottom: 6px !important;
      overflow: hidden !important;
      min-height: 48px !important;
      transition: transform 0.15s ease, background 0.15s ease !important;
    }
    .row:hover {
      background: #20315c !important;
      transform: translateX(2px) !important;
    }
    .row-bar {
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      background: linear-gradient(90deg, rgba(255, 194, 26, 0.18), rgba(255, 194, 26, 0.03)) !important;
      border-right: 2px solid rgba(255, 194, 26, 0.4) !important;
      pointer-events: none !important;
      z-index: 1 !important;
      transition: width 0.3s ease !important;
    }
    .row > * {
      position: relative !important;
      z-index: 2 !important;
    }

    /* Columna multiplicador izquierda */
    .row .m {
      flex: 0 0 70px !important;
      min-width: 70px !important;
      text-align: left !important;
    }
    .row .m b {
      font-family: var(--fn) !important;
      font-size: 19px !important;
      font-weight: 700 !important;
      color: var(--accent) !important;
      text-shadow: 0 0 10px rgba(255, 194, 26, 0.5) !important;
      white-space: nowrap !important;
    }

    /* Columna central de chips */
    .row .chips {
      display: flex !important;
      align-items: center !important;
      flex-wrap: wrap !important;
      gap: 6px !important;
      flex: 1 1 auto !important;
      min-width: 0 !important;
    }

    /* Columna derecha con botón JOIN */
    .row .act {
      flex: 0 0 auto !important;
      margin-left: auto !important;
      display: flex !important;
      align-items: center !important;
    }
    .row .join {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 32px !important;
      padding: 0 16px !important;
      border: none !important;
      border-radius: 999px !important;
      background: linear-gradient(135deg, #ffb800, #ff7a1a) !important;
      color: #1a0f00 !important;
      font-family: var(--font) !important;
      font-size: 13.5px !important;
      font-weight: 800 !important;
      letter-spacing: 0.05em !important;
      cursor: pointer !important;
      box-shadow: 0 0 14px rgba(255, 184, 0, 0.4) !important;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      transition: transform 0.15s ease, filter 0.15s ease !important;
    }
    .row .join:hover {
      transform: scale(1.05) !important;
      filter: brightness(1.1) !important;
    }
    .row .join:active {
      transform: scale(0.97) !important;
    }

    /* Chips y etiquetas */
    .mut {
      display: inline-flex !important;
      align-items: center !important;
      gap: 4px !important;
      padding: 3px 8px !important;
      border-radius: 6px !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      letter-spacing: 0.05em !important;
      text-transform: uppercase !important;
    }
    .mut-golden {
      background: linear-gradient(135deg, #ffd700, #ff9900) !important;
      color: #1a0f00 !important;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4) !important;
    }
    .mut-silver {
      background: linear-gradient(135deg, #e6ecf8, #94a3b8) !important;
      color: #0f172a !important;
    }
    .mut-rainbow {
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3) !important;
      background-size: 200% 200% !important;
      animation: rainbowShift 3s ease infinite !important;
      color: #000 !important;
      font-weight: 800 !important;
      box-shadow: 0 0 10px rgba(255, 107, 107, 0.5) !important;
    }
    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .mut-monstrous, .mut-big {
      background: linear-gradient(135deg, #a855f7, #6366f1) !important;
      color: #fff !important;
    }
    .mut-robado {
      background: #ef4444 !important;
      color: #fff !important;
    }
    .mut-parasite {
      background: #dc2626 !important;
      color: #fff !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 3px !important;
    }
    .chip-gen {
      padding: 3px 7px !important;
      background: rgba(255, 255, 255, 0.07) !important;
      border-radius: 6px !important;
      font-family: var(--fn) !important;
      font-weight: 600 !important;
      font-size: 12px !important;
      color: #cbd5e1 !important;
      white-space: nowrap !important;
    }
    .chip-users, .chip-age, .chip-timeout {
      font-size: 11.5px !important;
      color: var(--muted) !important;
      white-space: nowrap !important;
    }
    .chip-timeout {
      padding: 2px 6px !important;
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 6px !important;
      font-family: var(--fn) !important;
      font-weight: 600 !important;
    }
    .chip-speed {
      padding: 2px 7px !important;
      background: rgba(56, 189, 248, 0.15) !important;
      border: 1px solid rgba(56, 189, 248, 0.35) !important;
      border-radius: 6px !important;
      font-family: var(--fn) !important;
      font-weight: 700 !important;
      font-size: 11px !important;
      color: #38bdf8 !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 3px !important;
      white-space: nowrap !important;
    }
    .chip-money {
      padding: 2px 7px !important;
      background: rgba(34, 197, 94, 0.15) !important;
      border: 1px solid rgba(34, 197, 94, 0.35) !important;
      border-radius: 6px !important;
      font-family: var(--fn) !important;
      font-weight: 700 !important;
      font-size: 11px !important;
      color: #4ade80 !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 3px !important;
      white-space: nowrap !important;
    }

    /* UFO event widget */
    .ufo-w {
      max-width: 1720px;
      margin: 8px auto 0;
      padding: 0 16px;
    }
    .ufo {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(17, 26, 51, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 71, 236, 0.3);
      border-radius: var(--r);
      padding: 8px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .ufo.live {
      border-color: #8cff4a;
      box-shadow: 0 0 20px rgba(140, 255, 74, 0.25);
    }
    .ufo-ic {
      width: 38px;
      height: 22px;
      flex: none;
    }
    .ufo-n {
      font-family: var(--font);
      font-size: 15px;
      color: #cb94ff;
    }
    .ufo.live .ufo-n {
      color: #8cff4a;
    }
    .ufo-s {
      font-size: 11px;
      color: #8cff4a;
      font-weight: 700;
      text-transform: uppercase;
    }
    .ufo-t {
      font-family: var(--fn);
      font-size: 18px;
      font-weight: 700;
      color: #f4f7ff;
      margin-left: auto;
    }
    .ufo-bell {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 6px;
    }
    .ufo-bell:hover {
      color: #fff;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .cards {
        grid-template-columns: 1fr !important;
      }
      .bar {
        flex-wrap: wrap;
      }
      .seg {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body class="theme-dark corners-soft">
  <div id="app">
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
